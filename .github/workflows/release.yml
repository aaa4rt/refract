name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest     # Apple Silicon Macs (M1 and newer)
            args: --target aarch64-apple-darwin
          - platform: macos-latest     # Intel Macs
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Refract v__VERSION__'
          releaseBody: |
            Download the file for your computer:
            - **Windows:** the `.exe` (setup) or `.msi`
            - **Mac (M1/M2/M3/M4):** the `aarch64.dmg`
            - **Mac (Intel):** the `x64.dmg`
            - **Linux:** `.AppImage`, `.deb` or `.rpm`

            First time? See the README for the 2-minute Spotify setup.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
