[package]
name = "refract"
version = "0.2.0"
description = "A lightweight Spotify remote with a liquid glass look"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Keep the download small
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
